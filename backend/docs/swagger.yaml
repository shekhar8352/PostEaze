definitions:
  apiv1.GenerateTestTokenRequest:
    properties:
      user_id:
        type: string
    required:
    - user_id
    type: object
  apiv1.GenerateTestTokenResponse:
    properties:
      token:
        type: string
    type: object
  apiv1.MetaCallbackRequest:
    properties:
      code:
        type: string
      redirect_uri:
        type: string
      state:
        type: string
    required:
    - code
    - redirect_uri
    type: object
  modelsv1.ChannelInfo:
    properties:
      channel_id:
        type: integer
      channel_name:
        type: string
      created_at:
        type: string
      is_active:
        type: boolean
      metadata:
        additionalProperties: true
        type: object
      provider:
        type: string
      provider_channel_id:
        type: string
    type: object
  modelsv1.CreateFacebookChannelRequest:
    properties:
      channel_name:
        type: string
      code:
        type: string
      page_id:
        type: string
      redirect_uri:
        type: string
      team_id:
        type: string
    required:
    - code
    - page_id
    - redirect_uri
    type: object
  modelsv1.CreateFacebookChannelResponse:
    properties:
      channel_id:
        type: integer
      channel_name:
        type: string
    type: object
  modelsv1.CreateInstagramChannelRequest:
    properties:
      channel_name:
        type: string
      code:
        type: string
      metadata:
        additionalProperties: true
        type: object
      team_id:
        type: string
    required:
    - channel_name
    - code
    type: object
  modelsv1.CreateInstagramChannelResponse:
    properties:
      channel_id:
        type: integer
      channel_name:
        type: string
    type: object
  modelsv1.CreateScheduledPostRequest:
    properties:
      caption:
        type: string
      channel_ids:
        items:
          type: integer
        minItems: 1
        type: array
      media:
        $ref: '#/definitions/modelsv1.ScheduledMediaPayload'
      platforms:
        items:
          type: string
        minItems: 1
        type: array
      post_type:
        description: image | video | carousel
        type: string
      publish_now:
        description: if true, post immediately (no scheduled_publish_time)
        type: boolean
      scheduled_at:
        description: required when publish_now is false
        type: string
    required:
    - channel_ids
    - media
    - platforms
    - post_type
    type: object
  modelsv1.FirebaseAuthParams:
    properties:
      firebase_id:
        type: string
      firebase_token:
        type: string
      platform:
        enum:
        - email
        - google
        - facebook
        - microsoft
        type: string
    required:
    - firebase_id
    - firebase_token
    - platform
    type: object
  modelsv1.GetChannelsResponse:
    properties:
      channels:
        items:
          $ref: '#/definitions/modelsv1.ChannelInfo'
        type: array
      total:
        type: integer
    type: object
  modelsv1.GetPageDetailsResponse:
    properties:
      biography:
        type: string
      followers_count:
        type: integer
      follows_count:
        type: integer
      id:
        type: string
      media_count:
        type: integer
      name:
        type: string
      profile_picture_url:
        type: string
      username:
        type: string
      website:
        type: string
    type: object
  modelsv1.RefreshTokenParams:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  modelsv1.ScheduledMediaItem:
    properties:
      kind:
        description: image | video
        type: string
      url:
        type: string
    required:
    - kind
    - url
    type: object
  modelsv1.ScheduledMediaPayload:
    properties:
      items:
        items:
          $ref: '#/definitions/modelsv1.ScheduledMediaItem'
        minItems: 1
        type: array
    required:
    - items
    type: object
  modelsv1.SubscribeWebhooksRequest:
    properties:
      channel_id:
        type: integer
      fields:
        description: Optional, defaults to ["comments", "mentions", "story_insights"]
        items:
          type: string
        type: array
    required:
    - channel_id
    type: object
  modelsv1.SubscribeWebhooksResponse:
    properties:
      subscribed_fields:
        items:
          type: string
        type: array
      success:
        type: boolean
    type: object
  modelsv1.SyncMetaAnalyticsRequest:
    properties:
      channel_ids:
        items:
          type: integer
        type: array
    type: object
  modelsv1.SyncMetaAnalyticsResponse:
    properties:
      results:
        items:
          $ref: '#/definitions/modelsv1.SyncMetaAnalyticsResult'
        type: array
    type: object
  modelsv1.SyncMetaAnalyticsResult:
    properties:
      channel_id:
        type: integer
      message:
        type: string
      provider:
        type: string
      status:
        type: string
    type: object
  modelsv1.Team:
    properties:
      avatar_url:
        type: string
      description:
        type: string
      name:
        type: string
      owner_id:
        type: string
      status:
        type: string
      visibility:
        type: string
    type: object
  modelsv1.TeamMember:
    properties:
      id:
        type: string
      invited_by:
        type: string
      is_primary:
        type: boolean
      permissions:
        additionalProperties: true
        type: object
      role:
        type: string
      status:
        type: string
      team_id:
        type: string
      user_id:
        type: string
    type: object
  modelsv1.UpdateUserParams:
    properties:
      email:
        type: string
      id:
        type: string
    type: object
  modelsv1.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      firebase_id:
        type: string
      id:
        type: string
      memberships:
        items:
          $ref: '#/definitions/modelsv1.TeamMember'
        type: array
      name:
        type: string
      platforms:
        items:
          type: string
        type: array
      updated_at:
        type: string
    type: object
info:
  contact: {}
paths:
  /auth/authenticate:
    post:
      consumes:
      - application/json
      description: Authenticate user using Firebase token and local ID, create user
        if not exists
      parameters:
      - description: Firebase Authentication Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/modelsv1.FirebaseAuthParams'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Authenticate user with Firebase
      tags:
      - Auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Logs out the user by revoking their refresh token
      parameters:
      - description: Logout Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/modelsv1.RefreshTokenParams'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Logout User
      tags:
      - Authentication
  /auth/me:
    get:
      consumes:
      - application/json
      description: Get details of the currently logged in user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/modelsv1.User'
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - ApiKeyAuth: []
      summary: Get Logged In User
      tags:
      - Authentication
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Refreshes the access token using a valid refresh token
      parameters:
      - description: Refresh Token Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/modelsv1.RefreshTokenParams'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: Refresh Access Token
      tags:
      - Authentication
  /channels:
    get:
      consumes:
      - application/json
      description: Retrieves all channels for the authenticated user. Optionally filter
        by provider (e.g., instagram, facebook).
      parameters:
      - description: Filter by provider (instagram, facebook, etc.)
        in: query
        name: provider
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/modelsv1.GetChannelsResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get User Channels
      tags:
      - Channels
  /channels/{channelId}/analytics/audience:
    get:
      description: Lifetime demographic insights (audience_city, country, gender_age,
        locale) stored per UTC day during analytics sync
      parameters:
      - description: Channel ID
        in: path
        name: channelId
        required: true
        type: integer
      - description: Start date (YYYY-MM-DD)
        in: query
        name: start_date
        type: string
      - description: End date (YYYY-MM-DD)
        in: query
        name: end_date
        type: string
      - description: Page size (default 100, max 500; 0 = all)
        in: query
        name: limit
        type: integer
      - description: Offset
        in: query
        name: offset
        type: integer
      - description: 1 to include raw Meta JSON
        in: query
        name: include_raw
        type: string
      responses: {}
      security:
      - BearerAuth: []
      summary: Get Instagram audience snapshots
      tags:
      - Analytics
  /channels/{channelId}/analytics/comparison:
    get:
      responses: {}
      security:
      - BearerAuth: []
  /channels/{channelId}/analytics/dashboard:
    get:
      responses: {}
      security:
      - BearerAuth: []
      summary: Get Channel Dashboard
  /channels/{channelId}/analytics/overview:
    get:
      responses: {}
      security:
      - BearerAuth: []
      summary: Get Analytics Overview
      tags:
      - Analytics
  /channels/{channelId}/analytics/posts:
    get:
      description: Get Instagram post analytics for a channel within a date range
      parameters:
      - description: Channel ID
        in: path
        name: channelId
        required: true
        type: integer
      - description: Start date (YYYY-MM-DD)
        in: query
        name: start_date
        type: string
      - description: End date (YYYY-MM-DD)
        in: query
        name: end_date
        type: string
      - description: Filter by posts.post_type
        in: query
        name: post_type
        type: string
      - description: Page size (default 100, max 500; 0 = all)
        in: query
        name: limit
        type: integer
      - description: Offset
        in: query
        name: offset
        type: integer
      - description: 1 to include raw Meta JSON per row
        in: query
        name: include_raw
        type: string
      responses: {}
      security:
      - BearerAuth: []
      summary: Get Post Analytics
      tags:
      - Analytics
  /channels/{channelId}/analytics/posts-overview:
    get:
      responses: {}
      security:
      - BearerAuth: []
  /channels/{channelId}/analytics/posts/{postId}:
    get:
      responses: {}
      security:
      - BearerAuth: []
  /channels/{channelId}/analytics/profile:
    get:
      description: Get Instagram profile analytics for a channel within a date range
      parameters:
      - description: Channel ID
        in: path
        name: channelId
        required: true
        type: integer
      - description: Start date (YYYY-MM-DD)
        in: query
        name: start_date
        type: string
      - description: End date (YYYY-MM-DD)
        in: query
        name: end_date
        type: string
      - description: Page size (default 100, max 500; 0 = all)
        in: query
        name: limit
        type: integer
      - description: Offset
        in: query
        name: offset
        type: integer
      - description: 1 to include raw Meta JSON per row
        in: query
        name: include_raw
        type: string
      responses: {}
      security:
      - BearerAuth: []
      summary: Get Profile Analytics
      tags:
      - Analytics
  /channels/{channelId}/analytics/stories:
    get:
      parameters:
      - description: Filter by internal post id
        in: query
        name: post_id
        type: integer
      - description: Page size (default 100, max 500)
        in: query
        name: limit
        type: integer
      - description: Offset
        in: query
        name: offset
        type: integer
      - description: 1 for raw JSON
        in: query
        name: include_raw
        type: string
      responses: {}
      security:
      - BearerAuth: []
      summary: List story analytics
  /channels/{channelId}/analytics/top-posts:
    get:
      parameters:
      - default: engagement
        description: engagement|reach|impressions|plays
        in: query
        name: sort
        type: string
      - description: Filter by post_type
        in: query
        name: post_type
        type: string
      responses: {}
      security:
      - BearerAuth: []
      summary: Get Top Posts
  /channels/details:
    get:
      consumes:
      - application/json
      description: Fetches Instagram page details for a specific channel using the
        stored access token. Requires authentication.
      parameters:
      - description: Channel ID
        in: query
        name: channel_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/modelsv1.GetPageDetailsResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get Instagram Page Details
      tags:
      - Channels
  /channels/facebook/create:
    post:
      consumes:
      - application/json
      description: Exchanges OAuth code, resolves the Page, and stores the Page access
        token for analytics.
      parameters:
      - description: Create Facebook channel
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/modelsv1.CreateFacebookChannelRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/modelsv1.CreateFacebookChannelResponse'
      security:
      - BearerAuth: []
      summary: Create Facebook Page channel
      tags:
      - Channels
  /channels/instagram/create:
    post:
      consumes:
      - application/json
      description: Creates an Instagram channel by exchanging authorization code for
        token. Requires authentication via JWT token. Accepts optional metadata dictionary.
      parameters:
      - description: Create Instagram Channel Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/modelsv1.CreateInstagramChannelRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/modelsv1.CreateInstagramChannelResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Create Instagram Channel
      tags:
      - Channels
  /channels/instagram/subscribe-webhooks:
    post:
      consumes:
      - application/json
      description: Subscribes an Instagram channel to Meta webhooks (comments, mentions,
        story_insights). Requires authentication.
      parameters:
      - description: Subscribe Webhooks Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/modelsv1.SubscribeWebhooksRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/modelsv1.SubscribeWebhooksResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Subscribe to Meta Webhooks
      tags:
      - Channels
  /cron/trigger-instagram-analytics:
    post:
      consumes:
      - application/json
      description: Manually triggers the Instagram analytics sync job for immediate
        execution. Only available in development mode.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Trigger Instagram Analytics Sync (Development Only)
      tags:
      - Cron Jobs
  /cron/trigger-instagram-posts:
    post:
      consumes:
      - application/json
      description: Manually triggers the Instagram posts sync job for immediate execution.
        Only available in development mode.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Trigger Instagram Posts Sync (Development Only)
      tags:
      - Cron Jobs
  /cron/trigger-instagram-sync:
    post:
      consumes:
      - application/json
      description: Manually triggers the Instagram profile sync job for immediate
        execution. Only available in development mode.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Trigger Instagram Profile Sync (Development Only)
      tags:
      - Cron Jobs
  /dev/generate-token:
    post:
      consumes:
      - application/json
      description: Generates a JWT token for testing purposes. Only available in development
        mode.
      parameters:
      - description: User ID
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/apiv1.GenerateTestTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apiv1.GenerateTestTokenResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Generate Test Token (Development Only)
      tags:
      - Development
  /meta/analytics/sync:
    post:
      consumes:
      - application/json
      description: Fetches Instagram and/or Facebook Page insights for channels owned
        by the user.
      parameters:
      - description: Optional channel_ids filter
        in: body
        name: request
        schema:
          $ref: '#/definitions/modelsv1.SyncMetaAnalyticsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/modelsv1.SyncMetaAnalyticsResponse'
      security:
      - BearerAuth: []
      summary: Sync Meta analytics
      tags:
      - Meta
  /meta/callback:
    post:
      consumes:
      - application/json
      description: Exchanges authorization code for access token and fetches pages
      parameters:
      - description: Meta Callback Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/apiv1.MetaCallbackRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Handle Meta Callback
      tags:
      - Meta
  /posts:
    get:
      consumes:
      - application/json
      description: Get posts with filtering options
      parameters:
      - description: Comma separated channel IDs
        in: query
        name: channel_ids
        type: string
      - description: Provider name (e.g. instagram)
        in: query
        name: provider
        type: string
      - default: 20
        description: Limit
        in: query
        name: limit
        type: integer
      - description: Offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get Posts
      tags:
      - Posts
  /scheduled-posts:
    get:
      parameters:
      - description: Start (RFC3339 or YYYY-MM-DD)
        in: query
        name: from
        required: true
        type: string
      - description: End (RFC3339 or YYYY-MM-DD)
        in: query
        name: to
        required: true
        type: string
      - description: Filter by channel
        in: query
        name: channel_id
        type: integer
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List scheduled posts (calendar range)
      tags:
      - ScheduledPosts
    post:
      parameters:
      - description: Request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/modelsv1.CreateScheduledPostRequest'
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "207":
          description: Multi-Status
          schema:
            additionalProperties: true
            type: object
        "501":
          description: Not Implemented
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Create and submit scheduled post(s) to Instagram
      tags:
      - ScheduledPosts
  /scheduled-posts/{id}:
    delete:
      parameters:
      - description: Scheduled post ID
        in: path
        name: id
        required: true
        type: integer
      responses: {}
      security:
      - BearerAuth: []
      summary: Cancel a scheduled post (local + allowed statuses)
      tags:
      - ScheduledPosts
    get:
      parameters:
      - description: Scheduled post ID
        in: path
        name: id
        required: true
        type: integer
      responses: {}
      security:
      - BearerAuth: []
      summary: Get one scheduled post
      tags:
      - ScheduledPosts
  /teams:
    post:
      consumes:
      - application/json
      description: Create a team with name and owner ID
      parameters:
      - description: Team details
        in: body
        name: team
        required: true
        schema:
          $ref: '#/definitions/modelsv1.Team'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/modelsv1.Team'
        "400":
